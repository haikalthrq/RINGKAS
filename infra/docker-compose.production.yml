services:
  postgres:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}

  qdrant:
    ports: !reset []

  rag-worker:
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      BPS_API_KEY: ${BPS_API_KEY:?BPS_API_KEY must be set}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:?CLOUDFLARE_ACCOUNT_ID must be set}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN must be set}
      QDRANT_DENSE_DISTANCE: ${QDRANT_DENSE_DISTANCE:?QDRANT_DENSE_DISTANCE must be set}
      PDF_ALLOWED_HOSTS: ${PDF_ALLOWED_HOSTS:?PDF_ALLOWED_HOSTS must be set}
      INGESTION_RUNNING_JOB_TIMEOUT_SECONDS: ${INGESTION_RUNNING_JOB_TIMEOUT_SECONDS:?INGESTION_RUNNING_JOB_TIMEOUT_SECONDS must be set}
      INGESTION_DOCUMENT_RETRY_COUNT: ${INGESTION_DOCUMENT_RETRY_COUNT:?INGESTION_DOCUMENT_RETRY_COUNT must be set}

  rag-query:
    environment:
      RAG_INTERNAL_TOKEN: ${RAG_INTERNAL_TOKEN:?RAG_INTERNAL_TOKEN must be set}

  api:
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      RAG_INTERNAL_TOKEN: ${RAG_INTERNAL_TOKEN:?RAG_INTERNAL_TOKEN must be set}
      NVIDIA_NIM_API_KEY: ${NVIDIA_NIM_API_KEY:?NVIDIA_NIM_API_KEY must be set}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN must be set}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID must be set}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET must be set}
      REGISTERED_DAILY_QUOTA: ${REGISTERED_DAILY_QUOTA:?REGISTERED_DAILY_QUOTA must be set}
      DATA_PROTECTION_KEYS_PATH: /data/ringkas/keys

  web:
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
